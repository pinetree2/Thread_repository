services:
  - type: web
    name: trend2threads-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: LLM_PROVIDER
        value: openai
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATA_DIR
        value: /tmp/trend2threads-data
      - key: REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: FACT_CHECK_THRESHOLD
        value: "0.80"
      - key: MAX_RESEARCH_RETRY
        value: "2"
      - key: MAX_CONTENT_RETRY
        value: "2"
      - key: MAX_HN_ITEMS
        value: "60"
